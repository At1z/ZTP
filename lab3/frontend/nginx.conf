server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static pages are small and change often during development.
    add_header Cache-Control "no-cache";

    # The browser talks to one address. Only the public endpoints are proxied;
    # the internal /reservations API of the product service stays unreachable.
    location /api/products {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://product:8081;
    }

    location /api/cart {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://cart:8082;
    }

    location ~ ^/api/(orders|notifications) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://order:8083;
    }
}
