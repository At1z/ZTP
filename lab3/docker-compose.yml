services:
  postgres:
    image: postgres:16
    container_name: lab3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Application services start only with `--profile app` (make app-up), so that
  # `make up` + `make run-product` can be used for local development.
  product:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: product
    container_name: lab3-product
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SERVICE_DB: products
      RESERVATION_TTL: ${RESERVATION_TTL:-15m}
    ports:
      - "${PRODUCT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  order:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: order
    container_name: lab3-order
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SERVICE_DB: orders
    ports:
      - "${ORDER_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  cart:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: cart
    container_name: lab3-cart
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SERVICE_DB: carts
      PRODUCT_SERVICE_URL: http://product:8081
      ORDER_SERVICE_URL: http://order:8083
      CART_TTL: ${CART_TTL:-15m}
    ports:
      - "${CART_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
