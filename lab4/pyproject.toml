[project]
name = "weather"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "eccodes>=2.50.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
