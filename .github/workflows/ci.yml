name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab1
          POSTGRES_PASSWORD: lab1
          POSTGRES_DB: lab1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab1 -d lab1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lab1/go.mod
          cache-dependency-path: lab1/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Integration tests
        run: go test -count=1 -v ./tests/...
