name: CI lab3

on:
  pull_request:
    branches: [main]
    paths:
      - 'lab3/**'
      - '.github/workflows/ci-lab3.yml'

jobs:
  lab3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab3
          POSTGRES_PASSWORD: lab3
          POSTGRES_DB: lab3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab3 -d lab3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: lab3
      PGPASSWORD: lab3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lab3/go.mod
          cache-dependency-path: lab3/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

      # Same databases and migrations as docker/postgres/init-databases.sh.
      - name: Apply migrations
        run: |
          for pair in product:products cart:carts order:orders; do
            service="${pair%%:*}"
            database="${pair##*:}"
            psql -v ON_ERROR_STOP=1 -d lab3 -c "CREATE DATABASE $database"
            for file in migrations/"$service"/*.sql; do
              psql -v ON_ERROR_STOP=1 -d "$database" -f "$file"
            done
          done

      - name: Tests
        run: go test -count=1 -v ./...
