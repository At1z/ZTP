name: CI lab2

on:
  pull_request:
    branches: [main]
    paths:
      - 'lab2/**'
      - '.github/workflows/ci-lab2.yml'

jobs:
  lab2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab2
          POSTGRES_PASSWORD: lab2
          POSTGRES_DB: lab2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab2 -d lab2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: lab2
          RABBITMQ_DEFAULT_PASS: lab2
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lab2/go.mod
          cache-dependency-path: lab2/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integ
